# /etc/nginx/sites-available/carta_virtual_cuba

upstream carta_virtual_app {
    server unix:/var/www/carta_virtual_cuba/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # SSL
    ssl_certificate /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    ssl_prefer_server_ciphers off;

    # Seguridad
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Archivos estáticos
    location /static/ {
        alias /var/www/carta_virtual_cuba/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/carta_virtual_cuba/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Aplicación Django
    location / {
        proxy_pass http://carta_virtual_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_buffering off;
    }

    # WebSocket para notificaciones en tiempo real
    location /ws/ {
        proxy_pass http://carta_virtual_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Bloquear acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }

    location ~ /(\.git|\.env|\.pyc|\.db$) {
        deny all;
    }
}
