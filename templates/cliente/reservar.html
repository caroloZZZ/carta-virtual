{% extends 'base_publica.html' %}
{% load static %}

{% block title %}Reservar en {{ restaurante.nombre }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-primary text-white text-center py-4">
            <h3><i class="fas fa-calendar-check me-2"></i>Reserva tu mesa</h3>
        </div>
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <!-- Campos... -->
                <button type="submit" class="btn btn-primary w-100 py-3">Solicitar reserva</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
